[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false
authors = ["Dennis Guse"]

[workspace.dependencies]
# interne Crates
planora-math = { path = "crates/planora-math" }
planora-kernel = { path = "crates/planora-kernel" }
planora-mesh = { path = "crates/planora-mesh" }
planora-render = { path = "crates/planora-render" }
planora-sketch = { path = "crates/planora-sketch" }
planora-feature = { path = "crates/planora-feature" }
planora-project = { path = "crates/planora-project" }
planora-exchange = { path = "crates/planora-exchange" }
planora-step = { path = "crates/planora-step" }
planora-drawing = { path = "crates/planora-drawing" }
planora-update = { path = "crates/planora-update" }

# externe Crates (Lizenzen am 2026-10-09 geprüft: alle MIT und/oder Apache-2.0, earcutr ISC, spade MIT OR Apache-2.0, Roboto-Schrift Apache-2.0)
glam = "0.34"
robust = "1.2"
earcutr = "0.5"
spade = "2"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
proptest = "1"
# Die in egui eingebauten Standardschriften (OFL/Ubuntu-Lizenz) sind abgeschaltet;
# stattdessen wird Roboto (Apache-2.0) mitgeliefert, siehe crates/planora-app/assets/fonts.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
# eframe aktiviert die Standardfunktionen von winit nur über sein Feature "default";
# da das wegen der Schriften abgeschaltet ist, werden sie hier gleichwertig angefordert.
winit = "0.30"
# Dateiformat (Teilprojekt 6). Lizenzen: serde und serde_json MIT OR Apache-2.0; Unterpakete siehe cargo deny.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Ortszeit mit Sommerzeit zum jeweiligen Zeitpunkt (Projekte-Fenster, Aufgabe 0; am 2026-10-23 geprüft:
# MIT OR Apache-2.0, veröffentlicht 2026-06-04). Nur "clock": unter Windows kommt kein neues Unterpaket dazu.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# Update-Prüfung (Aufgabe Update-Funktion 3): kleiner blockierender HTTP-Client mit der
# Windows-eigenen TLS-Schicht (Schannel über native-tls). Ohne rustls/ring und ohne die
# webpki-Stammzertifikate (CDLA-Lizenz); geprüft wird gegen den Zertifikatsspeicher von Windows.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
