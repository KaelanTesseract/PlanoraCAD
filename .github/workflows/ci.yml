# Volle Prüfung (Format, Clippy, alle Tests, Lizenzen) unter Linux und Windows.
#
# Wird NICHT bei jedem Push gestartet, sondern vor einem Release von Hand:
#     gh workflow run ci.yml --ref <Zweig>
# (oder auf GitHub unter "Actions" -> "CI" -> "Run workflow"). tools/release.ps1 verlangt
# für den Commit, der veröffentlicht wird, einen erfolgreichen Lauf dieses Ablaufs.
# Alles andere wird lokal geprüft (Windows direkt, Linux in WSL).
name: CI
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust installieren
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Linux-Bibliotheken
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Lizenzen prüfen
        run: cargo install cargo-deny --locked && cargo deny check
