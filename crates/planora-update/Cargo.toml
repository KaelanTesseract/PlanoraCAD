[package]
name = "planora-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Testschalter für eine lokale Update-Quelle (nur für die Echtprobe auf dem Entwicklungsrechner):
# Release-Liste aus PLANORA_UPDATE_TEST_API und Downloads über http://127.0.0.1:<port>/…
# Standardmäßig AUS. Release-Builds dürfen ihn NIE einschalten (kein TLS, andere Quelle).
update-test-source = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
planora-i18n.workspace = true
# Versionen der Plug-ins (wie im Manifest des Hosts).
semver.workspace = true

# Netzzugriff unter Windows (Schannel) und Unix (native-tls: unter Linux das OpenSSL des Systems,
# gebaut über openssl-sys, braucht dort `libssl-dev` und `pkg-config`). Die Release-Liste des
# Programms (Update) bleibt nur Windows; auf anderen Systemen meldet `HttpSource` „nur Windows“.
[target.'cfg(any(windows, unix))'.dependencies]
ureq.workspace = true

[lints]
workspace = true
