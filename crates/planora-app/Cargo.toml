[package]
name = "planora-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "planora_app"
path = "src/lib.rs"

[[bin]]
name = "planora-app"
path = "src/main.rs"

[features]
# Lokale Update-Quelle für die Echtprobe (siehe planora-update). Standardmäßig AUS; Release-Builds
# dürfen ihn NIE einschalten.
update-test-source = ["planora-update/update-test-source"]
# Strg+Umschalt+Alt+F12 löst absichtlich eine Panik aus (Absturzbericht von Hand prüfen).
# Standardmäßig AUS; Release-Builds dürfen ihn NIE einschalten.
absturz-test = []

[dependencies]
planora-math.workspace = true
planora-kernel.workspace = true
planora-mesh.workspace = true
planora-render.workspace = true
planora-sketch.workspace = true
planora-feature.workspace = true
planora-project.workspace = true
planora-exchange.workspace = true
planora-step.workspace = true
planora-drawing.workspace = true
planora-update.workspace = true
planora-i18n.workspace = true
glam.workspace = true
eframe.workspace = true
egui.workspace = true
winit.workspace = true
# Fenster- und Programmsymbol sowie Logo im Über-Dialog aus PNG lesen (png ist über egui ohnehin im Baum).
png = "0.18"
# Ortszeit des Rechners für Zeitangaben (nur in local_time.rs benutzt).
chrono.workspace = true
# Prüfsumme der eigenen kleinen ZIP-Schreibfunktion (zip_store.rs, Projektdatei in der
# Rückmeldung). Am 2026-10-26 geprüft: MIT OR Apache-2.0, über png/wgpu ohnehin im Baum.
crc32fast = "=1.5.2"

# Windows-Version über RtlGetVersion, Rücksprungadressen im Absturzbericht (crash_addr), Install-Modus
# aus der Registry, Start des Installers (install_mode, update_install) und Sprachen der
# Oberfläche von Windows (system_language; windows-sys ist über andere Pakete ohnehin im Baum).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Zeichentabellen der Schriftdateien lesen (Zeichentest in tests/fonts.rs); skrifa zieht egui ohnehin.
skrifa = "0.44"
# Release-Listen für die Nachbildung der Update-Quelle (tests/update_check.rs).
serde_json.workspace = true

[lints]
workspace = true

[build-dependencies]
# Programmsymbol in die .exe einbetten (nur Windows, siehe build.rs).
embed-resource = "3"
