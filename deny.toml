[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: Hinweis auf fehlende Pflege, keine Sicherheitslücke. Wird nur auf dem Linux/Wayland-Pfad gezogen (winit 0.30 -> sctk-adwaita 0.10 -> ab_glyph -> ttf-parser) und unter Windows nicht gebaut. Erneut prüfen, sobald winit 0.31 stabil und übernommen ist (nutzt sctk-adwaita >= 0.12, das skrifa verwenden kann). / Unmaintained notice, not a vulnerability; only on the Linux/Wayland path, not built on Windows." },
]

[licenses]
version = 2
# Nur freizügige, GPL-3-kompatible Lizenzen. Alles andere: anhalten und den Menschen fragen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
