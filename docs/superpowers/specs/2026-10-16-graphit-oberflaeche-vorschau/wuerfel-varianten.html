<h2>Navigationswürfel: drei Vorschläge im Graphit-Stil</h2>
<p class="subtitle">Alle drei haben 26 anklickbare Bereiche (6 Flächen, 12 Kanten, 8 Ecken), einen Home-Knopf und heben die aktuelle Ansicht blau hervor. Je Variante vier Zustände: Fläche, Kante, Ecke und frei gedreht (dann ist nichts hervorgehoben).</p>

<style>
  .wv{display:grid;gap:16px}
  .wv .row{background:#0e0e0e;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;color:#939393;font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
  .wv .row h3{color:#fff;margin:0 0 4px;font-size:15px}
  .wv .row p{margin:0 0 10px;font-size:12px;color:#939393}
  .wv .states{display:flex;gap:14px;flex-wrap:wrap}
  .wv .st{display:flex;flex-direction:column;align-items:center;gap:6px;background:#181818;border:1px solid #383838;border-radius:14px;padding:10px 12px}
  .wv .st .cap{font-size:11px;color:#939393}
  .wv .st .name{font-size:12px;color:#fff;font-weight:600;min-height:16px}
  .wv .cubebox{position:relative}
  .wv .home{position:absolute;left:-2px;top:-2px;width:26px;height:26px;border-radius:50%;background:#262626;border:1px solid #383838;display:flex;align-items:center;justify-content:center}
  .wv .home svg{width:14px;height:14px;stroke:#d0d0d0;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>

<div class="wv" id="wv"></div>

<script>
(function(){
  var ACC='#006dfd', FILL='#262626', FILL_EDGE='#1e1e1e', FILL_CORNER='#161616', LINE='#4a4a4a', TXT='#cfcfcf';
  var INS=0.6;
  function norm(v){var l=Math.hypot(v[0],v[1],v[2]);return [v[0]/l,v[1]/l,v[2]/l];}
  // Regionen des Würfels: 6 Flächen, 12 Kanten, 8 Ecken
  function regions(){
    var R=[], s=[-1,1], i, j, k;
    var ax=[[1,0,0],[0,1,0],[0,0,1]];
    // Flächen
    for(var a=0;a<3;a++){ for(i=0;i<2;i++){
      var n=[0,0,0]; n[a]=s[i];
      var b=(a+1)%3, c=(a+2)%3, pts=[];
      [[-INS,-INS],[INS,-INS],[INS,INS],[-INS,INS]].forEach(function(q){var p=[0,0,0];p[a]=s[i];p[b]=q[0];p[c]=q[1];pts.push(p);});
      R.push({kind:'f',n:n,pts:pts});
    }}
    // Kanten (Achse a liegt entlang der Kante)
    for(var a2=0;a2<3;a2++){
      var b2=(a2+1)%3, c2=(a2+2)%3;
      for(i=0;i<2;i++)for(j=0;j<2;j++){
        var n2=[0,0,0]; n2[b2]=s[i]; n2[c2]=s[j];
        var p1=[0,0,0],p2=[0,0,0],p3=[0,0,0],p4=[0,0,0];
        p1[a2]=-INS; p1[b2]=s[i]; p1[c2]=s[j]*INS;
        p2[a2]= INS; p2[b2]=s[i]; p2[c2]=s[j]*INS;
        p3[a2]= INS; p3[b2]=s[i]*INS; p3[c2]=s[j];
        p4[a2]=-INS; p4[b2]=s[i]*INS; p4[c2]=s[j];
        R.push({kind:'e',n:n2,pts:[p1,p2,p3,p4]});
      }
    }
    // Ecken
    for(i=0;i<2;i++)for(j=0;j<2;j++)for(k=0;k<2;k++){
      var sx=s[i],sy=s[j],sz=s[k];
      R.push({kind:'c',n:[sx,sy,sz],pts:[[sx,sy*INS,sz*INS],[sx*INS,sy,sz*INS],[sx*INS,sy*INS,sz]]});
    }
    R.forEach(function(r){r.nn=norm(r.n);});
    return R;
  }
  var REG=regions();
  var NAMES={'0,-1,0':'Vorne','0,1,0':'Hinten','-1,0,0':'Links','1,0,0':'Rechts','0,0,1':'Oben','0,0,-1':'Unten'};
  function nameOf(r){
    var n=r.n, p=[];
    if(n[2]===1)p.push('Oben'); if(n[2]===-1)p.push('Unten');
    if(n[1]===-1)p.push('Vorne'); if(n[1]===1)p.push('Hinten');
    if(n[0]===1)p.push('Rechts'); if(n[0]===-1)p.push('Links');
    return p.join('-');
  }
  function build(opts, az, el, size, current){
    var azr=az*Math.PI/180, elr=el*Math.PI/180;
    var p=[Math.sin(azr)*Math.cos(elr), -Math.cos(azr)*Math.cos(elr), Math.sin(elr)];
    var r=[Math.cos(azr), Math.sin(azr), 0];
    var u=[-Math.sin(azr)*Math.sin(elr), Math.cos(azr)*Math.sin(elr), Math.cos(elr)];
    var sc=size*0.30, cx=size/2, cy=size/2;
    function proj(v){return [cx+(v[0]*r[0]+v[1]*r[1]+v[2]*r[2])*sc, cy-(v[0]*u[0]+v[1]*u[1]+v[2]*u[2])*sc];}
    var vis=[], hi=null, best=0.995;
    REG.forEach(function(g,idx){
      var d=g.nn[0]*p[0]+g.nn[1]*p[1]+g.nn[2]*p[2];
      if(d>0.02) vis.push({g:g,d:d});
      if(current&&d>best){best=d;hi=g;}
    });
    vis.sort(function(a,b){return a.d-b.d;});
    var svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
    vis.forEach(function(o){
      var g=o.g, P=g.pts.map(proj), pts=P.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
      var fill=g.kind==='f'?FILL:(g.kind==='e'?FILL_EDGE:FILL_CORNER);
      var stroke=LINE, sw=1;
      if(opts.tint && g.kind==='f'){
        var t=Math.abs(g.n[0])?'#e0303a':(Math.abs(g.n[1])?'#64be62':'#3d8bdb');
        fill=mix(FILL,t,0.28);
      }
      if(hi===g){fill=ACC; stroke='#6aa6ff'; sw=1.2;}
      svg+='<polygon points="'+pts+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linejoin="round"/>';
      if(opts.labels && g.kind==='f' && o.d>0.35){
        var cxy=P.reduce(function(a,q){return [a[0]+q[0]/4,a[1]+q[1]/4];},[0,0]);
        svg+='<text x="'+cxy[0].toFixed(1)+'" y="'+(cxy[1]+3.5).toFixed(1)+'" text-anchor="middle" font-size="'+(opts.fs||10)+'" font-weight="600" fill="'+(hi===g?'#fff':TXT)+'" font-family="Montserrat,Segoe UI,sans-serif">'+NAMES[g.n.join(',')]+'</text>';
      }
    });
    svg+='</svg>';
    return {svg:svg, name:hi?nameOf(hi):'frei gedreht'};
  }
  function mix(a,b,t){
    function h(x){return [parseInt(x.substr(1,2),16),parseInt(x.substr(3,2),16),parseInt(x.substr(5,2),16)];}
    var A=h(a),B=h(b);return '#'+[0,1,2].map(function(i){var v=Math.round(A[i]*(1-t)+B[i]*t);return (v<16?'0':'')+v.toString(16);}).join('');
  }
  var HOME='<div class="home" title="Home: Grundansicht"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></div>';
  var STATES=[
    {cap:'Fläche',az:0,el:0,cur:true},
    {cap:'Kante',az:90,el:45,cur:true},
    {cap:'Ecke (Iso)',az:45,el:35.264,cur:true},
    {cap:'frei gedreht',az:28,el:22,cur:false}
  ];
  var VARS=[
    {key:'a',title:'A  Würfel mit Beschriftung',txt:'Groß (120 px), die sichtbaren Flächen tragen ihren Namen. Home-Knopf links oben, darunter steht der Name der aktuellen Ansicht.',size:120,opts:{labels:true,tint:false,fs:10},name:true},
    {key:'b',title:'B  Kompakt',txt:'Klein (84 px), ohne Beschriftung, spart Platz. Der Name der aktuellen Ansicht steht unter dem Würfel, Home links oben.',size:84,opts:{labels:false,tint:false},name:true},
    {key:'c',title:'C  Graphit-Farben (X rot, Y grün, Z blau)',txt:'Mittelgroß (100 px), die Flächen sind leicht in den Achsenfarben getönt (Rechts/Links = X, Vorne/Hinten = Y, Oben/Unten = Z), Beschriftung nur auf großen Flächen.',size:100,opts:{labels:true,tint:true,fs:9},name:true}
  ];
  var out='';
  VARS.forEach(function(v){
    out+='<div class="row" data-choice="'+v.key+'" onclick="toggleSelect(this)"><h3>'+v.title+'</h3><p>'+v.txt+'</p><div class="states">';
    STATES.forEach(function(s){
      var b=build(v.opts,s.az,s.el,v.size,s.cur);
      out+='<div class="st"><div class="cubebox">'+HOME+b.svg+'</div><div class="name">'+(v.name?b.name:'')+'</div><div class="cap">'+s.cap+'</div></div>';
    });
    out+='</div></div>';
  });
  document.getElementById('wv').innerHTML=out;
})();
</script>
